<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Character encoding -->
    <meta charset="UTF-8">

    <!-- Makes the website responsive on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Browser tab title -->
    <title>DriveXpert Academy</title>

    <!-- Importing Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;700&family=Syne:wght@700&display=swap" rel="stylesheet">

    <style>

        /* CSS Variables (Reusable Colors) */
        :root {
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent-blue: #4285f4;
            --text-white: #ffffff;
            --text-dim: #94a3b8;
            --success: #22c55e;
            --danger: #ef4444;
        }

        /* Main body styling */
        body.inner-page {

            /* Website font */
            font-family: 'Plus Jakarta Sans', sans-serif;

            /* Background image with dark overlay */
            background:
                linear-gradient(rgba(15, 23, 42, 0.5),
                rgba(15, 23, 42, 0.85)),
                url('images/pexels-cesarperez209-733745.jpg')
                no-repeat center center;

            /* Make background cover entire screen */
            background-size: cover;

            /* Fixed background while scrolling */
            background-attachment: fixed;

            /* Remove default margin */
            margin: 0;

            /* Full screen height */
            min-height: 100vh;

            /* Text color */
            color: white;

            /* Space around page */
            padding: 20px;
        }

        /* Main container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        /* Form section layout */
        .forms-section {

            /* Grid layout */
            display: grid;

            /* 2 equal columns */
            grid-template-columns: 1fr 1fr;

            /* Gap between cards */
            gap: 20px;

            margin-bottom: 40px;
            margin-top: 20px;
        }

        /* Form card design */
        .form-card {

            /* Transparent background */
            background: var(--card-bg);

            padding: 25px;

            /* Rounded corners */
            border-radius: 15px;

            /* Light border */
            border: 1px solid rgba(255,255,255,0.1);

            /* Glass blur effect */
            backdrop-filter: blur(10px);
        }

        /* Form title */
        .form-card h2 {
            margin-top: 0;
            color: var(--accent-blue);
            font-size: 1.2rem;
        }

        /* Input spacing */
        .input-group {
            margin-bottom: 15px;
        }

        /* Label styling */
        label {
            display: block;
            color: var(--text-dim);
            font-size: 0.85rem;
            margin-bottom: 5px;
        }

        /* Input and dropdown styling */
        input,
        select {

            /* Full width */
            width: 100%;

            padding: 10px;

            /* Rounded edges */
            border-radius: 8px;

            border: 1px solid #334155;

            /* Dark transparent background */
            background: rgba(15, 23, 42, 0.8);

            color: white;

            /* Prevent width overflow */
            box-sizing: border-box;
        }

        /* Confirm booking button */
        .btn-book {

            background: var(--accent-blue);

            color: white;

            border: none;

            padding: 12px 20px;

            border-radius: 8px;

            cursor: pointer;

            font-weight: bold;

            width: 100%;

            /* Smooth animation */
            transition: 0.3s;

            margin-top: 10px;
        }

        /* Table container */
        .table-section {

            background: var(--card-bg);

            border-radius: 15px;

            padding: 20px;

            /* Horizontal scrolling if needed */
            overflow-x: auto;

            backdrop-filter: blur(10px);

            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Table styling */
        table {

            width: 100%;

            /* Remove double borders */
            border-collapse: collapse;

            min-width: 800px;
        }

        /* Table headers */
        th {

            text-align: left;

            color: var(--accent-blue);

            font-size: 0.8rem;

            text-transform: uppercase;

            padding: 15px;

            border-bottom: 1px solid #334155;
        }

        /* Table cells */
        td {

            padding: 15px;

            border-bottom: 1px solid #334155;

            font-size: 0.95rem;
        }

        /* Status badge */
        .status-pill {

            padding: 6px 14px;

            border-radius: 50px;

            font-size: 0.75rem;

            font-weight: bold;

            background: rgba(34, 197, 94, 0.1);

            color: var(--success);
        }

        /* Cancel button */
        .btn-cancel {

            background: none;

            border: 1px solid var(--danger);

            color: var(--danger);

            padding: 4px 10px;

            border-radius: 6px;

            cursor: pointer;

            font-size: 0.7rem;
        }

    </style>

</head>

<body class="inner-page">

<!-- Main container -->
<div class="container">

    <!-- Main heading -->
    <h1 style="font-family: 'Syne', sans-serif;">
        DriveXpert
        <span style="color: var(--accent-blue);">Academy</span>
    </h1>

    <!-- Forms section -->
    <div class="forms-section">

        <!-- Theory lesson form -->
        <div class="form-card">

            <h2>📘 Register Theory Lesson</h2>

            <!-- Theory form -->
            <form id="theoryForm">

                <!-- Student name input -->
                <div class="input-group">
                    <label>Student Name</label>
                    <input type="text" id="tName" required>
                </div>

                <!-- Instructor dropdown -->
                <div class="input-group">
                    <label>Instructor</label>
                    <select id="tInst"></select>
                </div>

                <!-- Date and time -->
                <div class="input-group">
                    <label>Date & Time</label>
                    <input type="datetime-local" id="tTime" required>
                </div>

                <!-- Submit button -->
                <button type="submit" class="btn-book">
                    Confirm Theory Lesson
                </button>

            </form>

        </div>

        <!-- Practical lesson form -->
        <div class="form-card">

            <h2>🚗 Register Practical Lesson</h2>

            <!-- Practical form -->
            <form id="practicalForm">

                <!-- Student name -->
                <div class="input-group">
                    <label>Student Name</label>
                    <input type="text" id="pName" required>
                </div>

                <!-- Instructor dropdown -->
                <div class="input-group">
                    <label>Instructor</label>
                    <select id="pInst"></select>
                </div>

                <!-- Date and time -->
                <div class="input-group">
                    <label>Date & Time</label>
                    <input type="datetime-local" id="pTime" required>
                </div>

                <!-- Submit button -->
                <button type="submit" class="btn-book">
                    Confirm Practical Lesson
                </button>

            </form>

        </div>

    </div>

    <!-- Schedule table section -->
    <div class="table-section">

        <h3>📅 Lesson Schedule</h3>

        <table>

            <!-- Table headings -->
            <thead>
                <tr>
                    <th>Student</th>
                    <th>Instructor</th>
                    <th>Date & Time</th>
                    <th>Type</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>

            <!-- Dynamic table body -->
            <tbody id="tableBody"></tbody>

        </table>

    </div>

</div>

<script>

    /* =========================================
       GET SAVED DATA FROM LOCAL STORAGE
    ========================================= */

    // Convert JSON string into JavaScript array
    // If no data exists use empty array []
    let lessonData =
        JSON.parse(localStorage.getItem('driveXpertData')) || [];



    /* =========================================
       LOAD INSTRUCTORS INTO DROPDOWNS
    ========================================= */

    function initInstructors() {

        // Theory instructors array
        const theoryIn = [
            "Nimal Perera",
            "Mr. Dinesh Kumara"
        ];

        // Practical instructors array
        const practicalIn = [
            "Kasun Jayawardena",
            "Amal De Silva",
            "Sunil Perera",
            "Deepani Silva",
            "Rohan Gunawardena"
        ];

        // Add theory instructors into dropdown
        document.getElementById('tInst').innerHTML =
            theoryIn.map(i =>
                `<option>${i}</option>`
            ).join('');

        // Add practical instructors into dropdown
        document.getElementById('pInst').innerHTML =
            practicalIn.map(i =>
                `<option>${i}</option>`
            ).join('');
    }



    /* =========================================
       DISPLAY DATA INSIDE TABLE
    ========================================= */

    function renderTable() {

        // Get table body
        const tbody =
            document.getElementById('tableBody');

        // Clear existing rows
        tbody.innerHTML = '';

        // Loop through all lesson data
        lessonData.forEach((item, index) => {

            // Create initials from student name
            // Example:
            // Kasun Perera -> KP
            const initials =
                item.name
                .split(' ')
                .map(n => n[0])
                .join('')
                .toUpperCase();



            /* =========================================
               FORMAT DATE & TIME
            ========================================= */

            // Convert string into Date object
            const dt = new Date(item.rawTime);

            // Extract date
            const formattedDate =
                dt.toISOString().split('T')[0];

            // Extract formatted time
            const formattedTime =
                dt.toLocaleString('en-US', {
                    hour: '2-digit',
                    minute: '2-digit',
                    hour12: true
                });



            /* =========================================
               CREATE TABLE ROW
            ========================================= */

            const row = `
                <tr>

                    <!-- Student column -->
                    <td>

                        <div style="
                            display: flex;
                            align-items: center;
                            gap: 10px;
                        ">

                            <!-- Initial circle -->
                            <div style="
                                width: 35px;
                                height: 35px;
                                border-radius: 50%;
                                background: #475569;
                                display: flex;
                                align-items: center;
                                justify-content: center;
                                font-weight: bold;
                                font-size: 0.8rem;
                            ">
                                ${initials}
                            </div>

                            <!-- Student name -->
                            <b>${item.name}</b>

                        </div>

                    </td>

                    <!-- Instructor -->
                    <td>${item.instructor}</td>

                    <!-- Date and time -->
                    <td>

                        <div style="
                            color: white;
                            font-weight: 500;
                            font-size: 1.1rem;
                        ">
                            ${formattedDate}
                        </div>

                        <div style="
                            color: #94a3b8;
                            font-size: 0.9rem;
                            margin-top: 2px;
                        ">
                            ${formattedTime}
                        </div>

                    </td>

                    <!-- Lesson type -->
                    <td>${item.type}</td>

                    <!-- Status -->
                    <td>
                        <span class="status-pill">
                            Confirmed
                        </span>
                    </td>

                    <!-- Delete button -->
                    <td>
                        <button
                            class="btn-cancel"
                            onclick="deleteItem(${index})">

                            Cancel

                        </button>
                    </td>

                </tr>
            `;

            // Add row into table
            tbody.innerHTML += row;
        });

        // Save updated data into local storage
        localStorage.setItem(
            'driveXpertData',
            JSON.stringify(lessonData)
        );
    }



    /* =========================================
       DELETE LESSON
    ========================================= */

    window.deleteItem = function(index) {

        // Confirmation popup
        if(confirm("Will i erase the data in the system?")) {

            // Remove selected lesson
            lessonData.splice(index, 1);

            // Refresh table
            renderTable();
        }
    }



    /* =========================================
       ADD NEW LESSON
    ========================================= */

    function addLesson(name, instructor, time, type) {

        // Add object into array
        lessonData.push({

            name: name,

            instructor: instructor,

            rawTime: time,

            type: type
        });

        // Refresh table
        renderTable();
    }



    /* =========================================
       THEORY FORM SUBMISSION
    ========================================= */

    document
        .getElementById('theoryForm')

        .addEventListener('submit', function(e) {

            // Prevent page refresh
            e.preventDefault();

            // Add lesson
            addLesson(
                document.getElementById('tName').value,
                document.getElementById('tInst').value,
                document.getElementById('tTime').value,
                'Theory'
            );

            // Clear form
            this.reset();
        });



    /* =========================================
       PRACTICAL FORM SUBMISSION
    ========================================= */

    document
        .getElementById('practicalForm')

        .addEventListener('submit', function(e) {

            // Prevent page refresh
            e.preventDefault();

            // Add lesson
            addLesson(
                document.getElementById('pName').value,
                document.getElementById('pInst').value,
                document.getElementById('pTime').value,
                'Practical'
            );

            // Clear form
            this.reset();
        });



    /* =========================================
       RUN WHEN PAGE LOADS
    ========================================= */

    window.onload = () => {

        // Load instructors
        initInstructors();

        // Display saved lessons
        renderTable();
    };

</script>

</body>
</html>
